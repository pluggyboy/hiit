<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background fills entire canvas for maskable icon -->
  <rect width="512" height="512" fill="#10b981"/>

  <!-- Content in safe zone (center 80%) -->
  <g transform="translate(256, 256)">
    <!-- HIIT text -->
    <text x="0" y="-20" font-family="Arial, Helvetica, sans-serif" font-size="160" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">HIIT</text>

    <!-- Timer text -->
    <text x="0" y="80" font-family="Arial, Helvetica, sans-serif" font-size="48" fill="white" text-anchor="middle" dominant-baseline="middle">Timer</text>
  </g>
</svg>
